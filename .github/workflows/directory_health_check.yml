name: Directory Health Patrol & Auto Deploy

on:
  schedule:
    - cron: '0 0 * * *' # 毎日日本時間9:00 (UTC 0:00) に自動徘徊
  workflow_dispatch:     # 手動実行も可能

permissions:
  contents: write

jobs:
  health-patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Architecture Guardrail
        run: node harness/global_rules/check_architecture_guard.js

      - name: Run Workspace Health Monitor & Build Dashboard
        run: node projects/workspace_health_monitor/generate_dashboard.js

      - name: Commit and Push Updated Health Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html projects/workspace_health_monitor/dist/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(patrol): auto-update workspace health dashboard [skip ci]" && git push)
