name: Autonomous Co-Evolutionary Hill-Climbing Engine

on:
  schedule:
    # 毎日 午前4時 (JST = 前日 19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hill-climb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Hill-Climbing Evolutionary Daemon
        run: |
          node projects/pt_student_portal/harness/hill-climb-daemon.js

      - name: Commit & Push Evolution Ledger Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projects/pt_student_portal/data/
          if git diff --staged --quiet; then
            echo "No evolutionary ledger updates to commit."
          else
            git commit -m 'chore(evolution): co-evolutionary hill climb epoch update [skip ci]'
            git push
          fi
